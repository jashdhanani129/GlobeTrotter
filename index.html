<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobeTrotter — Personalized Travel Planning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="toast"></div>
<div id="authApp" class="auth-shell hidden"></div>
<div id="app" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">G</span><span>GlobeTrotter</span></div>
    <nav id="mainNav">
      <button data-view="dashboard" class="nav-item active">⌂ <span>Dashboard</span></button>
      <button data-view="trips" class="nav-item">✈ <span>My Trips</span></button>
      <button data-view="create" class="nav-item">＋ <span>Plan New Trip</span></button>
      <button data-view="search" class="nav-item">⌕ <span>Explore</span></button>
      <button data-view="calendar" class="nav-item">▦ <span>Calendar</span></button>
      <button data-view="community" class="nav-item">◎ <span>Community</span></button>
      <button data-view="profile" class="nav-item">◯ <span>Profile</span></button>
      <button data-view="admin" class="nav-item admin-link hidden">▥ <span>Admin</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="mini-tip"><b>Travel smarter.</b><span>Plan stops, activities and budgets in one place.</span></div>
      <button id="logoutBtn" class="nav-item logout">↪ <span>Logout</span></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><span class="eyebrow" id="pageEyebrow">YOUR TRAVEL HUB</span><h1 id="pageTitle">Dashboard</h1></div>
      <div class="top-actions"><button class="icon-btn" data-view="community" title="Community">◎</button><button id="profileTop" class="avatar">G</button></div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
