<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Trip · GlobeTrotter</title><link rel="stylesheet" href="/styles.css"></head><body><div id="shareRoot" style="max-width:1100px;margin:auto;padding:30px"><div class="loading">Loading shared itinerary...</div></div><script>
const root=document.getElementById('shareRoot');const token=new URLSearchParams(location.search).get('token');const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
(async()=>{if(!token){root.innerHTML='<div class="card danger">Missing share token.</div>';return}try{const r=await fetch('/api/public/trips/'+token);const d=await r.json();if(!r.ok)throw Error(d.error);const t=d.trip;root.innerHTML=`<div class="hero"><div><span class="pill orange">Shared GlobeTrotter itinerary</span><h2>${esc(t.name)}</h2><p>${fmt(t.start_date)} – ${fmt(t.end_date)} · by @${esc(d.owner.username)}</p><p>${esc(t.description||'')}</p></div></div><div class="grid grid-2" style="margin-top:20px"><div>${t.stops.map(s=>`<div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">${esc(s.city_name)}, ${esc(s.country)}</h3><div class="muted">${fmt(s.start_date)} – ${fmt(s.end_date)}</div>${t.activities.filter(a=>a.stop_id===s.id).map(a=>`<div class="activity-line"><div class="time">${esc(a.start_time||'Anytime')}</div><div><div class="activity-name">${esc(a.activity_name)}</div><div class="activity-desc">${esc(a.description||'')}</div></div><div class="cost">${money(a.estimated_cost)}</div></div>`).join('')||'<div class="muted" style="margin-top:15px">No activities listed.</div>'}</div>`).join('')||'<div class="card empty">No stops listed.</div>'}</div><div><div class="card"><h3 style="margin-top:0">Trip summary</h3><div class="stat"><span class="muted">Stops</span><b>${t.stops.length}</b></div><div class="stat" style="margin-top:12px"><span class="muted">Activities</span><b>${t.activities.length}</b></div><div class="stat" style="margin-top:12px"><span class="muted">Estimated cost</span><b>${money(t.total_cost)}</b></div><button id="copy" class="btn primary" style="width:100%;margin-top:18px">Copy this trip to my GlobeTrotter</button><div class="notice" style="margin-top:12px">Login is required to copy a public itinerary.</div></div></div></div>`;document.getElementById('copy').onclick=()=>{const token=localStorage.getItem('gt_token');if(!token){location.href='/#login';alert('Please log in to copy this trip.');return}fetch('/api/trips/'+t.id+'/copy',{method:'POST',headers:{Authorization:'Bearer '+token}}).then(x=>x.json()).then(x=>{if(x.error)alert(x.error);else location.href='/'})}}catch(e){root.innerHTML='<div class="card danger">'+esc(e.message)+'</div>'}})();
</script></body></html>
